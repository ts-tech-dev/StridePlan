name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project StridePlan.xcodeproj \
            -scheme StridePlan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Summarize errors and warnings
        if: always()
        run: |
          echo "### Errors" ; grep -E "error:" xcodebuild.log | sort -u | head -100 || true
          echo "### Warnings" ; grep -E "warning:" xcodebuild.log | grep -v "appintentsmetadataprocessor" | sort -u | head -100 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
